name: Snapshot Update Command

on:
  issue_comment:
    types: [created]

permissions: read-all

jobs:
  update-snapshots:
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/update-snapshots') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Get PR details
        id: pr
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('is_fork', String(
              pr.data.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`
            ));

      - name: Refuse fork PR
        if: steps.pr.outputs.is_fork == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Cannot auto-update snapshots for fork PRs — CI cannot push to a forked repository.\n\nPlease run `npx playwright test --grep "visual snapshot" --update-snapshots` locally and push the updated snapshot files.',
            });

      - name: Checkout PR branch
        if: steps.pr.outputs.is_fork == 'false'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        if: steps.pr.outputs.is_fork == 'false'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.pr.outputs.is_fork == 'false'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.pr.outputs.is_fork == 'false'
        run: npx playwright install chromium --with-deps

      - name: Regenerate visual snapshots
        if: steps.pr.outputs.is_fork == 'false'
        run: npx playwright test --grep "visual snapshot" --update-snapshots

      - name: Commit and push updated snapshots
        if: steps.pr.outputs.is_fork == 'false'
        id: commit
        working-directory: .
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Scoped add is the guard that makes [skip ci] safe — only snapshot
          # files are staged, so no code changes can bypass CI via this path.
          git add frontend/tests/e2e/snapshots/
          if git diff --staged --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update Playwright visual snapshots [skip ci]"
            git push origin "HEAD:${HEAD_REF}"
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Post result comment
        if: steps.pr.outputs.is_fork == 'false'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const noChanges = '${{ steps.commit.outputs.no_changes }}' === 'true';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: noChanges
                ? 'Snapshots are already up to date — no changes were needed.'
                : 'Snapshots updated and committed to this branch. CI will re-run shortly.',
            });
