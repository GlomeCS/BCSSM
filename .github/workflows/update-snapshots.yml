name: Update Playwright Snapshots

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Branch to open the snapshot PR against"
        required: false
        default: "develop"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.base_branch || 'develop' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Regenerate visual snapshots
        run: npx playwright test --grep "visual snapshot" --update-snapshots

      - name: Open PR with updated snapshots
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.inputs.base_branch || 'develop' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/tests/e2e/snapshots/
          if git diff --staged --quiet; then
            echo "No snapshot changes — nothing to commit."
            exit 0
          fi
          BRANCH="chore/update-snapshots-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "chore: update Playwright visual snapshots [skip ci]"
          git push origin "$BRANCH"
          gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "chore: update Playwright visual snapshots" \
            --body "Auto-generated by the **Update Playwright Snapshots** workflow. Merge once CI passes."
