name: Regenerate Snapshots

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to update snapshots for
        type: string
        required: true
      head_sha:
        description: Exact commit SHA to check out
        type: string
        required: true
      head_ref:
        description: Branch name to push updated snapshots to
        type: string
        required: true

permissions: read-all

jobs:
  # Validates that the supplied inputs actually correspond to the PR's
  # current head before we do anything privileged with them. Without this,
  # a caller could pass a head_ref that doesn't match head_sha (e.g. a
  # protected branch) and trick the commit job into pushing there.
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verified_sha: ${{ steps.verify.outputs.sha }}
      verified_ref: ${{ steps.verify.outputs.ref }}
    steps:
      - name: Verify inputs match PR head
        id: verify
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          HEAD_REF: ${{ inputs.head_ref }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });

            if (pr.state !== 'open') {
              core.setFailed(`PR #${process.env.PR_NUMBER} is not open (state: ${pr.state})`);
              return;
            }
            if (pr.head.sha !== process.env.HEAD_SHA) {
              core.setFailed(`head_sha input (${process.env.HEAD_SHA}) does not match PR head (${pr.head.sha})`);
              return;
            }
            if (pr.head.ref !== process.env.HEAD_REF) {
              core.setFailed(`head_ref input (${process.env.HEAD_REF}) does not match PR branch (${pr.head.ref})`);
              return;
            }
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('PR head is from a fork; refusing to push snapshots back to a fork-owned branch.');
              return;
            }

            core.setOutput('sha', pr.head.sha);
            core.setOutput('ref', pr.head.ref);
  generate:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.validate.outputs.verified_sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          # No `cache: npm` here on purpose: this job may build an
          # untrusted/PR-controlled commit (via head_sha), and setup-node's
          # npm cache is keyed off package-lock.json in a scope that's
          # shared with trusted default-branch workflows. Populating it
          # here would let a malicious lockfile/postinstall script poison
          # the cache that a later privileged run restores from
          # (cache poisoning). Use a run-scoped cache below instead.

      - name: Cache node_modules (run-scoped, not shared across workflows)
        uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4
        with:
          path: frontend/node_modules
          # Key is unique to this run so it can never be written by an
          # untrusted commit and later restored by a trusted workflow.
          key: snapshot-regen-${{ runner.os }}-${{ github.run_id }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            snapshot-regen-${{ runner.os }}-${{ github.run_id }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Regenerate visual snapshots
        run: npx playwright test --grep "visual snapshot" --update-snapshots

      - name: Check for snapshot changes
        id: check
        working-directory: .
        run: |
          git add frontend/tests/e2e/snapshots/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload updated snapshots
        if: steps.check.outputs.has_changes == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updated-snapshots
          path: frontend/tests/e2e/snapshots/
          retention-days: 1

  commit:
    needs: [validate, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.validate.outputs.verified_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download updated snapshots
        if: needs.generate.outputs.has_changes == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: updated-snapshots
          path: frontend/tests/e2e/snapshots/

      - name: Commit and push
        if: needs.generate.outputs.has_changes == 'true'
        env:
          HEAD_REF: ${{ needs.validate.outputs.verified_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/tests/e2e/snapshots/
          git commit -m "chore: update Playwright visual snapshots"
          git push origin "HEAD:${HEAD_REF}"

      - name: Post result comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const hasChanges = '${{ needs.generate.outputs.has_changes }}' === 'true';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: hasChanges
                ? 'Snapshots updated and committed to this branch. CI will re-run shortly.'
                : 'Snapshots are already up to date — no changes were needed.',
            });
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
