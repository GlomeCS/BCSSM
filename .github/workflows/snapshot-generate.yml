name: Regenerate Snapshots

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to update snapshots for
        type: string
        required: true
      head_sha:
        description: Exact commit SHA to check out
        type: string
        required: true
      head_ref:
        description: Branch name to push updated snapshots to
        type: string
        required: true

permissions: read-all

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.head_sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Regenerate visual snapshots
        run: npx playwright test --grep "visual snapshot" --update-snapshots

      - name: Check for snapshot changes
        id: check
        working-directory: .
        run: |
          git add frontend/tests/e2e/snapshots/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload updated snapshots
        if: steps.check.outputs.has_changes == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updated-snapshots
          path: frontend/tests/e2e/snapshots/
          retention-days: 1

  commit:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download updated snapshots
        if: needs.generate.outputs.has_changes == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: updated-snapshots
          path: frontend/tests/e2e/snapshots/

      - name: Commit and push
        if: needs.generate.outputs.has_changes == 'true'
        env:
          HEAD_REF: ${{ inputs.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/tests/e2e/snapshots/
          git commit -m "chore: update Playwright visual snapshots"
          git push origin "HEAD:${HEAD_REF}"

      - name: Post result comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const hasChanges = '${{ needs.generate.outputs.has_changes }}' === 'true';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: hasChanges
                ? 'Snapshots updated and committed to this branch. CI will re-run shortly.'
                : 'Snapshots are already up to date — no changes were needed.',
            });
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
