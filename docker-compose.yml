version: '3.8'

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
      
  web:
    build:
      context: .
      args:
        CACHEBUST: "latest"
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Ensures Flask doesn't auto-reload in Gunicorn container
      FLASK_ENV: production
      # Override ONLY for local Docker - doesn't affect Render
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped